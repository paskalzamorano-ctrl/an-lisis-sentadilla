<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Biomecánico - Sentadilla</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1200px; }
        button, input[type="file"] { padding: 10px 15px; background-color: #00bcd4; color: black; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0097a7; }
        .btn-capture { background-color: #e91e63; color: white; }
        .btn-capture:hover { background-color: #c2185b; }
        .video-container { display: flex; gap: 20px; justify-content: center; width: 100%; max-width: 1200px; flex-wrap: wrap; }
        .view-box { position: relative; width: 48%; min-width: 300px; background-color: #000; border: 2px solid #00bcd4; border-radius: 8px; overflow: hidden; aspect-ratio: 9/16; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .analysis-panel { background-color: #1e1e1e; padding: 20px; border-radius: 8px; margin-top: 20px; width: 100%; max-width: 1160px; display: flex; gap: 20px; }
        .result-section { flex: 1; background-color: #2d2d2d; padding: 15px; border-radius: 8px; }
        h3.title-overlay { position: absolute; top: 10px; left: 10px; z-index: 10; margin:0; text-shadow: 2px 2px 4px #000; color: white; }
    </style>
</head>
<body>

    <div class="controls">
        <div><label>Video Sagital (Lento): </label><input type="file" id="uploadLateral" accept="video/*"></div>
        <div><label>Video Frontal (Lento): </label><input type="file" id="uploadFrontal" accept="video/*"></div>
        <button id="btnPlayPause">Reproducir / Pausar Ambos</button>
        <button class="btn-capture" id="btnCapture">📸 Capturar Resultados</button>
    </div>

    <div class="video-container">
        <div class="view-box">
            <h3 class="title-overlay">Plano Sagital</h3>
            <video id="videoLateral" loop playsinline muted></video>
            <canvas id="canvasLateral"></canvas>
        </div>
        <div class="view-box">
            <h3 class="title-overlay">Plano Frontal</h3>
            <video id="videoFrontal" loop playsinline muted></video>
            <canvas id="canvasFrontal"></canvas>
        </div>
    </div>

    <div class="analysis-panel" id="analysisText">
        <div class="result-section">
            <h3 style="color: #00bcd4;">Resultados: Plano Frontal</h3>
            <p id="resFrontal">Esperando captura... Sube los videos en cámara lenta y presiona "Capturar Resultados".</p>
        </div>
        <div class="result-section">
            <h3 style="color: #00bcd4;">Resultados: Plano Sagital</h3>
            <p id="resSagital">Esperando captura...</p>
        </div>
    </div>

<script>
    const videoLateral = document.getElementById('videoLateral'), canvasLateral = document.getElementById('canvasLateral'), ctxLateral = canvasLateral.getContext('2d');
    const videoFrontal = document.getElementById('videoFrontal'), canvasFrontal = document.getElementById('canvasFrontal'), ctxFrontal = canvasFrontal.getContext('2d');

    let currentAngles = { cadera: 0, rodillaLat: 0, tobillo: 0, hombroLat: 0, codoLat: 0, valgoIzq: 0, valgoDer: 0, hombroFIzq: 0, codoFIzq: 0, hombroFDer: 0, codoFDer: 0 };

    function calcAngle(a, b, c) {
        if (!a || !b || !c || a.visibility < 0.6 || b.visibility < 0.6 || c.visibility < 0.6) return 0;
        let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
        let angle = Math.abs(radians * 180.0 / Math.PI);
        if (angle > 180.0) angle = 360.0 - angle;
        return Math.round(angle);
    }

    // Dibuja la cara tipo malla geométrica (sin dibujar los puntos base)
    function drawGeometricFace(ctx, lm, w, h) {
        if(!lm[0] || lm[0].visibility < 0.5) return;
        const faceLines = [
            [0,1],[1,2],[2,3],[3,7],[7,9],[9,0], // Izquierda
            [0,4],[4,5],[5,6],[6,8],[8,10],[10,0], // Derecha
            [9,10], [1,4], [3,9], [6,10] 
        ];
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        faceLines.forEach(conn => {
            const p1 = lm[conn[0]], p2 = lm[conn[1]];
            if(p1 && p2) {
                ctx.beginPath(); ctx.moveTo(p1.x * w, p1.y * h); ctx.lineTo(p2.x * w, p2.y * h); ctx.stroke();
            }
        });
    }

    function drawBodyConnections(ctx, lm, w, h) {
        const bodyConnections = [
            [11,12], [11,23], [12,24], [23,24], // Tronco
            [23,25], [25,27], [24,26], [26,28], [27,29], [28,30], [29,31], [30,32], [27,31], [28,32], // Piernas y pies
            [11,13], [13,15], // Brazo izquierdo
            [12,14], [14,16]  // Brazo derecho
        ];
        ctx.strokeStyle = "#00bcd4";
        ctx.lineWidth = 3;
        bodyConnections.forEach(conn => {
            const p1 = lm[conn[0]], p2 = lm[conn[1]];
            if(p1 && p2 && p1.visibility > 0.5 && p2.visibility > 0.5) {
                ctx.beginPath(); ctx.moveTo(p1.x * w, p1.y * h); ctx.lineTo(p2.x * w, p2.y * h); ctx.stroke();
            }
        });
    }

    // Dibuja los puntos (marcadores) excluyendo CARA (0-10) y MANOS (17-22)
    function drawMarkers(ctx, lm, w, h) {
        ctx.fillStyle = "#ffffff";
        for (let i = 0; i < lm.length; i++) {
            if (i <= 10) continue; // Omite puntos de la cara
            if (i >= 17 && i <= 22) continue; // Omite puntos de las manos
            if (lm[i].visibility > 0.6) {
                ctx.beginPath(); ctx.arc(lm[i].x * w, lm[i].y * h, 4, 0, 2 * Math.PI); ctx.fill();
            }
        }
    }

    function drawTextAngle(ctx, angle, point, w, h, offsetX = 15, offsetY = 0) {
        if(angle > 0) {
            ctx.font = "22px Arial"; ctx.fillStyle = "yellow";
            ctx.fillText(`${angle}°`, point.x * w + offsetX, point.y * h + offsetY);
        }
    }

    function setupPose(pose) { pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 }); }
    const poseLateral = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`}); setupPose(poseLateral);
    const poseFrontal = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`}); setupPose(poseFrontal);

    // PROCESAMIENTO SAGITAL
    poseLateral.onResults((results) => {
        ctxLateral.clearRect(0, 0, canvasLateral.width, canvasLateral.height);
        ctxLateral.drawImage(results.image, 0, 0, canvasLateral.width, canvasLateral.height);
        if (results.poseLandmarks) {
            const lm = results.poseLandmarks;
            const w = canvasLateral.width, h = canvasLateral.height;
            
            drawGeometricFace(ctxLateral, lm, w, h);
            drawBodyConnections(ctxLateral, lm, w, h);
            drawMarkers(ctxLateral, lm, w, h);

            const hombro = lm[12], codo = lm[14], muñeca = lm[16];
            const cadera = lm[24], rodilla = lm[26], tobillo = lm[28], pie = lm[32];
            
            currentAngles.hombroLat = calcAngle(cadera, hombro, codo);
            currentAngles.codoLat = calcAngle(hombro, codo, muñeca);
            currentAngles.cadera = calcAngle(hombro, cadera, rodilla);
            currentAngles.rodillaLat = calcAngle(cadera, rodilla, tobillo);
            currentAngles.tobillo = calcAngle(rodilla, tobillo, pie);

            drawTextAngle(ctxLateral, currentAngles.hombroLat, hombro, w, h);
            drawTextAngle(ctxLateral, currentAngles.codoLat, codo, w, h);
            drawTextAngle(ctxLateral, currentAngles.cadera, cadera, w, h);
            drawTextAngle(ctxLateral, currentAngles.rodillaLat, rodilla, w, h);
            drawTextAngle(ctxLateral, currentAngles.tobillo, tobillo, w, h);
        }
    });

    // PROCESAMIENTO FRONTAL
    poseFrontal.onResults((results) => {
        ctxFrontal.clearRect(0, 0, canvasFrontal.width, canvasFrontal.height);
        ctxFrontal.drawImage(results.image, 0, 0, canvasFrontal.width, canvasFrontal.height);
        if (results.poseLandmarks) {
            const lm = results.poseLandmarks;
            const w = canvasFrontal.width, h = canvasFrontal.height;

            drawGeometricFace(ctxFrontal, lm, w, h);
            drawBodyConnections(ctxFrontal, lm, w, h);
            drawMarkers(ctxFrontal, lm, w, h);

            const homIzq = lm[11], codIzq = lm[13], muñIzq = lm[15];
            const cadIzq = lm[23], rodIzq = lm[25], tobIzq = lm[27];
            const homDer = lm[12], codDer = lm[14], muñDer = lm[16];
            const cadDer = lm[24], rodDer = lm[26], tobDer = lm[28];

            currentAngles.hombroFIzq = calcAngle(cadIzq, homIzq, codIzq);
            currentAngles.codoFIzq = calcAngle(homIzq, codIzq, muñIzq);
            currentAngles.valgoIzq = calcAngle(cadIzq, rodIzq, tobIzq);

            currentAngles.hombroFDer = calcAngle(cadDer, homDer, codDer);
            currentAngles.codoFDer = calcAngle(homDer, codDer, muñDer);
            currentAngles.valgoDer = calcAngle(cadDer, rodDer, tobDer);

            drawTextAngle(ctxFrontal, currentAngles.hombroFIzq, homIzq, w, h);
            drawTextAngle(ctxFrontal, currentAngles.codoFIzq, codIzq, w, h);
            drawTextAngle(ctxFrontal, currentAngles.valgoIzq, rodIzq, w, h);
            
            drawTextAngle(ctxFrontal, currentAngles.hombroFDer, homDer, w, h, -45);
            drawTextAngle(ctxFrontal, currentAngles.codoFDer, codDer, w, h, -45);
            drawTextAngle(ctxFrontal, currentAngles.valgoDer, rodDer, w, h, -45);
        }
    });

    async function processFrames() {
        if (!videoLateral.paused || !videoFrontal.paused) {
            if(!videoLateral.paused) await poseLateral.send({image: videoLateral});
            if(!videoFrontal.paused) await poseFrontal.send({image: videoFrontal});
            requestAnimationFrame(processFrames);
        }
    }

    document.getElementById('btnPlayPause').addEventListener('click', () => {
        if (videoLateral.paused || videoFrontal.paused) {
            videoLateral.play(); videoFrontal.play(); processFrames();
        } else {
            videoLateral.pause(); videoFrontal.pause();
        }
    });

    document.getElementById('btnCapture').addEventListener('click', () => {
        videoLateral.pause(); videoFrontal.pause();
        
        document.getElementById('resFrontal').innerHTML = `
            <ul>
                <li><strong>Hombro Izq/Der:</strong> ${currentAngles.hombroFIzq}° / ${currentAngles.hombroFDer}°</li>
                <li><strong>Codo Izq/Der:</strong> ${currentAngles.codoFIzq}° / ${currentAngles.codoFDer}°</li>
                <li><strong>Valgo Pierna Izq:</strong> ${currentAngles.valgoIzq}°</li>
                <li><strong>Valgo Pierna Der:</strong> ${currentAngles.valgoDer}°</li>
            </ul>
        `;
        document.getElementById('resSagital').innerHTML = `
            <ul>
                <li><strong>Hombro (Sagital):</strong> ${currentAngles.hombroLat}°</li>
                <li><strong>Codo (Sagital):</strong> ${currentAngles.codoLat}°</li>
                <li><strong>Cadera/Tronco:</strong> ${currentAngles.cadera}°</li>
                <li><strong>Rodilla:</strong> ${currentAngles.rodillaLat}°</li>
                <li><strong>Tobillo:</strong> ${currentAngles.tobillo}°</li>
            </ul>
        `;
    });

    function setupVideo(inputId, videoEl, canvasEl) {
        document.getElementById(inputId).addEventListener('change', (e) => {
            videoEl.src = URL.createObjectURL(e.target.files[0]);
            videoEl.onloadedmetadata = () => { canvasEl.width = videoEl.videoWidth; canvasEl.height = videoEl.videoHeight; };
        });
    }
    setupVideo('uploadLateral', videoLateral, canvasLateral);
    setupVideo('uploadFrontal', videoFrontal, canvasFrontal);
</script>
</body>
</html>
