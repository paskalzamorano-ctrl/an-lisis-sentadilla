<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de Sentadilla - MediaPipe</title>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #ccc;
        }

        .upload-section {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 25px;
            flex-wrap: wrap;
        }

        .upload-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            text-align: center;
        }

        .upload-box h3 {
            margin-top: 0;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 10px;
        }

        .video-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
        }

        .video-box {
            position: relative;
            background: black;
            border-radius: 10px;
            overflow: hidden;
            min-height: 350px;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 600px;
            object-fit: contain;
            display: block;
            background: black;
        }

        .video-title {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: bold;
        }

        /*
            Canvas encima del video.
            Aquí se dibujan:
            - puntos corporales
            - líneas
            - ángulos
        */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            padding: 25px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #playPause {
            background: #222;
            color: white;
        }

        #capture {
            background: #b51d1d;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .critical-analysis {
            background: white;
            margin: 20px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        .critical-analysis h2 {
            text-align: center;
            margin-top: 0;
        }

        .angle-results {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .angle-card {
            background: #f0f1f3;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
        }

        .angle-card h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        .angle-value {
            font-size: 28px;
            font-weight: bold;
        }

        #status {
            text-align: center;
            padding: 10px;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .video-container {
                grid-template-columns: 1fr;
            }

            .angle-results {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .angle-results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Analizador de Sentadilla</h1>
    <p>Análisis biomecánico mediante MediaPipe</p>
</header>


<!-- =========================
     CARGA DE VIDEOS
========================= -->

<section class="upload-section">

    <div class="upload-box">
        <h3>Vista Sagital</h3>
        <input
            type="file"
            id="sagittalInput"
            accept="video/*">
    </div>

    <div class="upload-box">
        <h3>Vista Frontal</h3>
        <input
            type="file"
            id="frontalInput"
            accept="video/*">
    </div>

</section>


<div id="status">
    Carga ambos videos para comenzar.
</div>


<!-- =========================
     VIDEOS
========================= -->

<section class="video-container">

    <!-- SAGITAL -->

    <div class="video-box">

        <div class="video-title">
            SAGITAL
        </div>

        <video
            id="sagittalVideo"
            playsinline>
        </video>

        <canvas
            id="sagittalCanvas"
            class="overlay">
        </canvas>

    </div>


    <!-- FRONTAL -->

    <div class="video-box">

        <div class="video-title">
            FRONTAL
        </div>

        <video
            id="frontalVideo"
            playsinline>
        </video>

        <canvas
            id="frontalCanvas"
            class="overlay">
        </canvas>

    </div>

</section>


<!-- =========================
     CONTROLES
========================= -->

<div class="controls">

    <button id="playPause">
        ▶ Reproducir
    </button>

    <button id="capture">
        📸 Capturar momento crítico
    </button>

</div>


<!-- =========================
     RESULTADOS
========================= -->

<section class="critical-analysis">

    <h2>
        Análisis del momento crítico
    </h2>

    <div class="angle-results">

        <div class="angle-card">
            <h3>Hombro</h3>
            <div
                class="angle-value"
                id="criticalShoulder">
                --
            </div>
        </div>

        <div class="angle-card">
            <h3>Codo</h3>
            <div
                class="angle-value"
                id="criticalElbow">
                --
            </div>
        </div>

        <div class="angle-card">
            <h3>Cadera</h3>
            <div
                class="angle-value"
                id="criticalHip">
                --
            </div>
        </div>

        <div class="angle-card">
            <h3>Rodilla</h3>
            <div
                class="angle-value"
                id="criticalKnee">
                --
            </div>
        </div>

        <div class="angle-card">
            <h3>Tobillo</h3>
            <div
                class="angle-value"
                id="criticalAnkle">
                --
            </div>
        </div>

    </div>

</section>


<script>

    /*
    ============================================================
        VARIABLES PRINCIPALES
    ============================================================
    */

    const sagittalVideo =
        document.getElementById("sagittalVideo");

    const frontalVideo =
        document.getElementById("frontalVideo");

    const sagittalCanvas =
        document.getElementById("sagittalCanvas");

    const frontalCanvas =
        document.getElementById("frontalCanvas");

    const sagittalCtx =
        sagittalCanvas.getContext("2d");

    const frontalCtx =
        frontalCanvas.getContext("2d");


    const playPause =
        document.getElementById("playPause");

    const capture =
        document.getElementById("capture");

    const status =
        document.getElementById("status");


    /*
    ============================================================
        RESULTADOS ACTUALES
    ============================================================
    */

    let currentAngles = {

        shoulder: null,

        elbow: null,

        hip: null,

        knee: null,

        ankle: null

    };


    /*
    ============================================================
        RESULTADOS SAGITALES Y FRONTALES
    ============================================================
    */

    let sagittalAngles = {};

    let frontalAngles = {};


    /*
    ============================================================
        CARGA DE VIDEOS
    ============================================================
    */

    document
        .getElementById("sagittalInput")
        .addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) return;

            sagittalVideo.src =
                URL.createObjectURL(file);

            sagittalVideo.load();

            status.textContent =
                "Video sagital cargado.";

        });


    document
        .getElementById("frontalInput")
        .addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) return;

            frontalVideo.src =
                URL.createObjectURL(file);

            frontalVideo.load();

            status.textContent =
                "Video frontal cargado.";

        });


    /*
    ============================================================
        MEDIA PIPE POSE
    ============================================================
    */

    const sagittalPose = new Pose({

        locateFile: function(file) {

            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

        }

    });


    const frontalPose = new Pose({

        locateFile: function(file) {

            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;

        }

    });


    sagittalPose.setOptions({

        modelComplexity: 1,

        smoothLandmarks: true,

        enableSegmentation: false,

        smoothSegmentation: true,

        minDetectionConfidence: 0.5,

        minTrackingConfidence: 0.5

    });


    frontalPose.setOptions({

        modelComplexity: 1,

        smoothLandmarks: true,

        enableSegmentation: false,

        smoothSegmentation: true,

        minDetectionConfidence: 0.5,

        minTrackingConfidence: 0.5

    });


    /*
    ============================================================
        FUNCIÓN PARA CALCULAR ÁNGULOS
    ============================================================
    */

    function calculateAngle(a, b, c) {

        /*
            b = articulación central

            Calculamos el ángulo ABC
        */

        const radians =
            Math.atan2(
                c.y - b.y,
                c.x - b.x
            )
            -
            Math.atan2(
                a.y - b.y,
                a.x - b.x
            );

        let degrees =
            Math.abs(
                radians * 180 / Math.PI
            );

        if (degrees > 180) {

            degrees =
                360 - degrees;

        }

        return Math.round(degrees);

    }


    /*
    ============================================================
        PROCESAMIENTO DEL VIDEO SAGITAL
    ============================================================
    */

    sagittalPose.onResults(function(results) {

        drawPose(
            results,
            sagittalCanvas,
            sagittalCtx,
            "sagittal"
        );

    });


    /*
    ============================================================
        PROCESAMIENTO DEL VIDEO FRONTAL
    ============================================================
    */

    frontalPose.onResults(function(results) {

        drawPose(
            results,
            frontalCanvas,
            frontalCtx,
            "frontal"
        );

    });


    /*
    ============================================================
        DIBUJAR ESQUELETO + ÁNGULOS
    ============================================================
    */

    function drawPose(
        results,
        canvas,
        ctx,
        view
    ) {

        if (!results.poseLandmarks) return;


        const landmarks =
            results.poseLandmarks;


        /*
        Ajustamos el canvas
        */

        canvas.width =
            canvas.clientWidth;

        canvas.height =
            canvas.clientHeight;


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
        ========================================================
            FUNCIÓN PARA CONVERTIR COORDENADAS
        ========================================================
        */

        function point(index) {

            return {

                x:
                    landmarks[index].x *
                    canvas.width,

                y:
                    landmarks[index].y *
                    canvas.height

            };

        }


        /*
        ========================================================
            PUNTOS CORPORALES
        ========================================================
        */

        const nose =
            point(0);

        const leftShoulder =
            point(11);

        const rightShoulder =
            point(12);

        const leftElbow =
            point(13);

        const rightElbow =
            point(14);

        const leftWrist =
            point(15);

        const rightWrist =
            point(16);

        const leftHip =
            point(23);

        const rightHip =
            point(24);

        const leftKnee =
            point(25);

        const rightKnee =
            point(26);

        const leftAnkle =
            point(27);

        const rightAnkle =
            point(28);

        const leftHeel =
            point(29);

        const rightHeel =
            point(30);

        const leftFoot =
            point(31);

        const rightFoot =
            point(32);


        /*
        ========================================================
            DIBUJAR ESQUELETO
        ========================================================
        */

        ctx.strokeStyle = "white";

        ctx.lineWidth = 3;


        function line(a, b) {

            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );

            ctx.stroke();

        }


        line(leftShoulder, leftElbow);
        line(leftElbow, leftWrist);

        line(rightShoulder, rightElbow);
        line(rightElbow, rightWrist);

        line(leftShoulder, leftHip);
        line(rightShoulder, rightHip);

        line(leftHip, leftKnee);
        line(leftKnee, leftAnkle);

        line(rightHip, rightKnee);
        line(rightKnee, rightAnkle);

        line(leftAnkle, leftFoot);
        line(rightAnkle, rightFoot);


        /*
        ========================================================
            DIBUJAR PUNTOS
        ========================================================
        */

        ctx.fillStyle = "yellow";


        const importantPoints = [

            leftShoulder,
            rightShoulder,

            leftElbow,
            rightElbow,

            leftHip,
            rightHip,

            leftKnee,
            rightKnee,

            leftAnkle,
            rightAnkle

        ];


        importantPoints.forEach(function(p) {

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                5,
                0,
                Math.PI * 2
            );

            ctx.fill();

        });


        /*
        ========================================================
            CÁLCULO DE ÁNGULOS
        ========================================================
        */

        let shoulderAngle;

        let elbowAngle;

        let hipAngle;

        let kneeAngle;

        let ankleAngle;


        /*
        ========================================================
            VISTA SAGITAL
        ========================================================
        */

        if (view === "sagittal") {

            /*
                Utilizamos el lado izquierdo.

                Hombro:
                cadera - hombro - codo

                Codo:
                hombro - codo - muñeca

                Cadera:
                hombro - cadera - rodilla

                Rodilla:
                cadera - rodilla - tobillo

                Tobillo:
                rodilla - tobillo - pie
            */


            shoulderAngle =
                calculateAngle(
                    leftHip,
                    leftShoulder,
                    leftElbow
                );


            elbowAngle =
                calculateAngle(
                    leftShoulder,
                    leftElbow,
                    leftWrist
                );


            hipAngle =
                calculateAngle(
                    leftShoulder,
                    leftHip,
                    leftKnee
                );


            kneeAngle =
                calculateAngle(
                    leftHip,
                    leftKnee,
                    leftAnkle
                );


            ankleAngle =
                calculateAngle(
                    leftKnee,
                    leftAnkle,
                    leftFoot
                );


            sagittalAngles = {

                shoulder:
                    shoulderAngle,

                elbow:
                    elbowAngle,

                hip:
                    hipAngle,

                knee:
                    kneeAngle,

                ankle:
                    ankleAngle

            };

        }


        /*
        ========================================================
            VISTA FRONTAL
        ========================================================
        */

        if (view === "frontal") {

            /*
                Para la vista frontal calculamos
                principalmente los ángulos laterales
                entre los segmentos corporales.

                Se utilizan ambos lados para
                representar la postura frontal.
            */


            const leftKneeAngle =
                calculateAngle(
                    leftHip,
                    leftKnee,
                    leftAnkle
                );


            const rightKneeAngle =
                calculateAngle(
                    rightHip,
                    rightKnee,
                    rightAnkle
                );


            const leftHipAngle =
                calculateAngle(
                    leftShoulder,
                    leftHip,
                    leftKnee
                );


            const rightHipAngle =
                calculateAngle(
                    rightShoulder,
                    rightHip,
                    rightKnee
                );


            const leftShoulderAngle =
                calculateAngle(
                    leftHip,
                    leftShoulder,
                    leftElbow
                );


            const rightShoulderAngle =
                calculateAngle(
                    rightHip,
                    rightShoulder,
                    rightElbow
                );


            /*
                Promediamos ambos lados.
            */

            kneeAngle =
                Math.round(
                    (
                        leftKneeAngle +
                        rightKneeAngle
                    ) / 2
                );


            hipAngle =
                Math.round(
                    (
                        leftHipAngle +
                        rightHipAngle
                    ) / 2
                );


            shoulderAngle =
                Math.round(
                    (
                        leftShoulderAngle +
                        rightShoulderAngle
                    ) / 2
                );


            frontalAngles = {

                shoulder:
                    shoulderAngle,

                hip:
                    hipAngle,

                knee:
                    kneeAngle

            };

        }


        /*
        ========================================================
            MOSTRAR ÁNGULOS SOBRE EL CUERPO
        ========================================================
        */

        if (view === "sagittal") {

            drawAngleText(
                ctx,
                shoulderAngle,
                leftShoulder.x + 10,
                leftShoulder.y - 10
            );


            drawAngleText(
                ctx,
                elbowAngle,
                leftElbow.x + 10,
                leftElbow.y
            );


            drawAngleText(
                ctx,
                hipAngle,
                leftHip.x + 10,
                leftHip.y - 10
            );


            drawAngleText(
                ctx,
                kneeAngle,
                leftKnee.x + 10,
                leftKnee.y
            );


            drawAngleText(
                ctx,
                ankleAngle,
                leftAnkle.x + 10,
                leftAnkle.y
            );

        }


        if (view === "frontal") {

            drawAngleText(
                ctx,
                shoulderAngle,
                leftShoulder.x + 10,
                leftShoulder.y
            );


            drawAngleText(
                ctx,
                hipAngle,
                leftHip.x + 10,
                leftHip.y
            );


            drawAngleText(
                ctx,
                kneeAngle,
                leftKnee.x + 10,
                leftKnee.y
            );

        }


        /*
        ========================================================
            GUARDAR LOS ÁNGULOS ACTUALES
        ========================================================
        */

        if (view === "sagittal") {

            currentAngles = {

                shoulder:
                    shoulderAngle,

                elbow:
                    elbowAngle,

                hip:
                    hipAngle,

                knee:
                    kneeAngle,

                ankle:
                    ankleAngle

            };

        }

    }


    /*
    ============================================================
        TEXTO DE ÁNGULOS
    ============================================================
    */

    function drawAngleText(
        ctx,
        angle,
        x,
        y
    ) {

        if (angle === null ||
            angle === undefined) {

            return;

        }


        ctx.font =
            "bold 20px Arial";

        ctx.fillStyle =
            "white";

        ctx.strokeStyle =
            "black";

        ctx.lineWidth = 4;


        const text =
            `${angle}°`;


        ctx.strokeText(
            text,
            x,
            y
        );


        ctx.fillText(
            text,
            x,
            y
        );

    }


    /*
    ============================================================
        PROCESAMIENTO CONTINUO
    ============================================================
    */

    let processing = false;


    async function processVideos() {

        if (
            sagittalVideo.readyState >= 2 &&
            !sagittalVideo.paused
        ) {

            await sagittalPose.send({

                image:
                    sagittalVideo

            });

        }


        if (
            frontalVideo.readyState >= 2 &&
            !frontalVideo.paused
        ) {

            await frontalPose.send({

                image:
                    frontalVideo

            });

        }


        if (
            !sagittalVideo.paused ||
            !frontalVideo.paused
        ) {

            requestAnimationFrame(
                processVideos
            );

        }

    }


    /*
    ============================================================
        PLAY / PAUSA
    ============================================================
    */

    playPause.addEventListener(
        "click",
        async function() {

            if (
                !sagittalVideo.src ||
                !frontalVideo.src
            ) {

                alert(
                    "Primero debes cargar los dos videos."
                );

                return;

            }


            /*
                Si están pausados,
                reproducimos ambos.
            */

            if (
                sagittalVideo.paused &&
                frontalVideo.paused
            ) {

                await sagittalVideo.play();

                await frontalVideo.play();

                playPause.textContent =
                    "⏸ Pausar";

                status.textContent =
                    "Analizando movimiento...";

                processVideos();

            }

            else {

                /*
                    Pausamos ambos
                */

                sagittalVideo.pause();

                frontalVideo.pause();

                playPause.textContent =
                    "▶ Reproducir";

                status.textContent =
                    "Análisis pausado.";

            }

        }
    );


    /*
    ============================================================
        SINCRONIZACIÓN
    ============================================================
    */

    sagittalVideo.addEventListener(
        "timeupdate",
        function() {

            if (
                !frontalVideo.seeking &&
                Math.abs(
                    frontalVideo.currentTime -
                    sagittalVideo.currentTime
                ) > 0.08
            ) {

                frontalVideo.currentTime =
                    sagittalVideo.currentTime;

            }

        }
    );


    frontalVideo.addEventListener(
        "timeupdate",
        function() {

            if (
                !sagittalVideo.seeking &&
                Math.abs(
                    sagittalVideo.currentTime -
                    frontalVideo.currentTime
                ) > 0.08
            ) {

                sagittalVideo.currentTime =
                    frontalVideo.currentTime;

            }

        }
    );


    /*
    ============================================================
        CAPTURA DEL MOMENTO CRÍTICO
    ============================================================
    */

    capture.addEventListener(
        "click",
        function() {

            /*
                Tomamos los valores que MediaPipe
                está detectando exactamente en ese momento.
            */

            document
                .getElementById("criticalShoulder")
                .textContent =
                currentAngles.shoulder !== null
                    ? `${currentAngles.shoulder}°`
                    : "--";


            document
                .getElementById("criticalElbow")
                .textContent =
                currentAngles.elbow !== null
                    ? `${currentAngles.elbow}°`
                    : "--";


            document
                .getElementById("criticalHip")
                .textContent =
                currentAngles.hip !== null
                    ? `${currentAngles.hip}°`
                    : "--";


            document
                .getElementById("criticalKnee")
                .textContent =
                currentAngles.knee !== null
                    ? `${currentAngles.knee}°`
                    : "--";


            document
                .getElementById("criticalAnkle")
                .textContent =
                currentAngles.ankle !== null
                    ? `${currentAngles.ankle}°`
                    : "--";


            /*
                Bajamos automáticamente
                al análisis.
            */

            document
                .querySelector(".critical-analysis")
                .scrollIntoView({
                    behavior: "smooth"
                });

        }
    );


    /*
    ============================================================
        CUANDO TERMINA UN VIDEO
    ============================================================
    */

    sagittalVideo.addEventListener(
        "ended",
        function() {

            frontalVideo.pause();

            playPause.textContent =
                "▶ Reproducir";

            status.textContent =
                "Análisis finalizado.";

        }
    );

</script>

</body>
</html>
